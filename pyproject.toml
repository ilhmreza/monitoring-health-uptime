[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uptimebot"
version = "1.0.0"
description = "Uptime & SSL expiry monitor with Discord reporting and web admin UI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "httpx==0.28.1",
    "cryptography==44.0.1",
    "PyYAML==6.0.2",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "bcrypt==4.2.1",
    "aiosqlite==0.20.0",
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[project.scripts]
uptimebot = "uptimebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uptimebot = [
    "db/*.sql",
    "templates/*.html",
    "templates/partials/*.html",
    "static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Auto mode is what runs the async tests at all. Without it pytest-asyncio
# *skips* them silently, which turns a green run into a run that quietly tested
# almost nothing — tests/conftest.py fails loudly if this is ever unset.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:uptimebot.*"]

<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status_code }} · UptimeBot</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-dot"></span> UptimeBot</a>
</header>
<main class="container">
  <div class="card" style="max-width:560px;margin:60px auto;text-align:center">
    <div style="font-size:52px;font-weight:600;color:var(--muted-bg)">{{ status_code }}</div>
    <h2 style="margin:8px 0 6px">
      {% if status_code == 404 %}Halaman tidak ditemukan
      {% elif status_code == 403 %}Akses ditolak
      {% else %}Terjadi kesalahan{% endif %}
    </h2>
    <p class="muted">{{ detail }}</p>
    <div style="margin-top:20px">
      <a class="btn btn-primary" href="/">Kembali ke dashboard</a>
    </div>
  </div>
</main>
</body>
</html>
